minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@unocss/cli@66.10.1'
  - '@unocss/config@66.10.1'
  - '@unocss/core@66.10.1'
  - '@unocss/extractor-arbitrary-variants@66.10.1'
  - '@unocss/inspector@66.10.1'
  - '@unocss/preset-attributify@66.10.1'
  - '@unocss/preset-icons@66.10.1'
  - '@unocss/preset-mini@66.10.1'
  - '@unocss/preset-tagify@66.10.1'
  - '@unocss/preset-typography@66.10.1'
  - '@unocss/preset-uno@66.10.1'
  - '@unocss/preset-web-fonts@66.10.1'
  - '@unocss/preset-wind3@66.10.1'
  - '@unocss/preset-wind4@66.10.1'
  - '@unocss/preset-wind@66.10.1'
  - '@unocss/rollup@66.10.1'
  - '@unocss/rule-utils@66.10.1'
  - '@unocss/transformer-attributify-jsx@66.10.1'
  - '@unocss/transformer-compile-class@66.10.1'
  - '@unocss/transformer-directives@66.10.1'
  - '@unocss/transformer-variant-group@66.10.1'
  - '@unocss/vite@66.10.1'
  - unocss@66.10.1
  - '@unocss/postcss@66.10.1'

trustPolicy: strict
shellEmulator: true

packages:
  - packages/*
  - playgrounds/*

# `@shikijs/vitepress-twoslash@2.5.0` declares `"@shikijs/twoslash": ""`, an empty
# range that resolves to shiki 4.x — a different major than the shiki 2.5.0 that
# vitepress 1.6.4 bundles, and the transformer is handed shiki's own context.
# Pin it to the matching 2.5.0 so the transformer and the renderer agree.
overrides:
  '@shikijs/twoslash': 2.5.0

allowBuilds:
  '@firebase/util': true
  electron: true
  esbuild: true
  protobufjs: true
  simple-git-hooks: true
